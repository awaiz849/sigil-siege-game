<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sigil Siege</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; }
      /* 3D canvas at the bottom, 2D overlay (HUD, trail, menus) on top */
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay { pointer-events: none; }
      /* Cinematic vignette between the 3D scene and the HUD: darkens the screen edges. */
      #vignette { position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(3,2,12,0.55) 100%); }
      /* Loading screen: plain HTML so it shows instantly, before the JS bundle runs. src/ui/loadingScreen.ts
         fills the bar with real download progress and fades it out. */
      @font-face { font-family: 'Silkscreen'; src: url('/fonts/Silkscreen-Bold.ttf'); font-weight: 700; }
      #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 22px; background: #0D0B24; color: #e8e2ff; font-family: 'Silkscreen', monospace;
        transition: opacity 0.5s; }
      #loading.loading-done { opacity: 0; pointer-events: none; }
      #loading h1 { margin: 0; font-size: clamp(32px, 7vw, 72px); font-weight: 700; color: #F2C14E; letter-spacing: 0.06em; }
      #loading .bar { width: min(420px, 80vw); height: 14px; border: 2px solid #F2C14E; border-radius: 4px; padding: 2px; }
      #loading-fill { height: 100%; width: 0%; background: #F2C14E; transition: width 0.15s; }
      #loading-text { margin: 0; font-family: monospace; font-size: 14px; opacity: 0.85; min-height: 1.2em; }
      /* Friendly error / info notices (src/ui/notice.ts): plain HTML, so they work even without WebGL. */
      .notice { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: rgba(13, 11, 36, 0.92); }
      .notice-box { position: relative; max-width: 560px; width: 100%; box-sizing: border-box; padding: 28px 28px 24px;
        background: #1a1640; border: 2px solid #F2C14E; border-radius: 10px; color: #e8e2ff;
        font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      .notice-box h2 { margin: 0 0 12px; font: 700 26px 'Silkscreen', monospace; color: #F2C14E; letter-spacing: 0.04em; }
      .notice-box p { margin: 0 0 10px; }
      .notice-hint { font-size: 14px; opacity: 0.75; }
      .notice-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
      .notice-actions button { font: 700 15px system-ui, sans-serif; padding: 10px 22px; border-radius: 6px; cursor: pointer;
        border: 2px solid #F2C14E; background: transparent; color: #F2C14E; }
      .notice-actions button.primary { background: #F2C14E; color: #0D0B24; }
      .notice-banner { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 19; max-width: calc(100vw - 32px); }
      .notice-banner .notice-box { padding: 8px 40px 8px 16px; font-size: 14px; border-width: 1px; border-radius: 8px;
        background: rgba(26, 22, 64, 0.92); text-align: left; }
      .notice-banner .notice-box p { margin: 0; }
      .notice-close { position: absolute; top: 2px; right: 6px; border: 0; background: none; color: #F2C14E;
        font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 6px; }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>SIGIL SIEGE</h1>
      <div class="bar"><div id="loading-fill"></div></div>
      <p id="loading-text">Loading...</p>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
